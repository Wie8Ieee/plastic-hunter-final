openapi: 3.1.0
info:
  title: Plastic Hunter AI API
  version: 1.0.0
  description: Runtime API for the Plastic Hunter AI FastAPI demo.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /detect:
    post:
      summary: Upload an image and store a lightweight CV demo detection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        "200":
          description: Detection result
        "400":
          description: Invalid or empty image upload
        "413":
          description: Image exceeds upload limit
        "422":
          description: Invalid image or coordinate values
  /results:
    get:
      summary: List stored detections
      responses:
        "200":
          description: Stored detection rows
  /stats:
    get:
      summary: Dashboard statistics and documented estimates
      responses:
        "200":
          description: Aggregate monitoring statistics
  /demo:
    post:
      summary: Reset and reseed demo detections
      responses:
        "200":
          description: Demo data reset result
  /results/{filename}:
    get:
      summary: Serve an annotated result image
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Annotated JPEG image
        "400":
          description: Invalid filename
        "404":
          description: Image not found
  /evidence:
    get:
      summary: Judge-ready technical evidence sheet
      responses:
        "200":
          description: Evidence sheet data
  /disclosure:
    get:
      summary: AI, library, dataset, and scope disclosure
      responses:
        "200":
          description: Disclosure data
  /sonar/ping:
    post:
      summary: Run a reproducible eco-sonar simulation scenario
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                source_level:
                  type: number
                  default: 200
                frequency_kHz:
                  type: number
                  default: 10
                pulse_ms:
                  type: number
                  default: 100
                ping_interval_s:
                  type: number
                  default: 5
                mission_min:
                  type: number
                  default: 60
                sea_state:
                  type: integer
                  default: 3
                  minimum: 1
                  maximum: 5
                depth_m:
                  type: number
                  default: 50
                seed:
                  type: integer
                  default: 42
      responses:
        "200":
          description: Sonar scenario metrics, sweeps, assumptions, and target results
