<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="title desc">
  <title id="title">Plastic Hunter AI Architecture</title>
  <desc id="desc">A vertical system architecture flow from user to FastAPI, computer vision, sonar engine, SQLite, analytics, and dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="58%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#102235"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11283d"/>
      <stop offset="100%" stop-color="#0f1c2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c5d8"/>
    </marker>
  </defs>
  <rect width="1180" height="740" rx="28" fill="url(#bg)"/>
  <circle cx="112" cy="104" r="64" fill="#06b6d4" opacity="0.08"/>
  <circle cx="1046" cy="634" r="92" fill="#22c55e" opacity="0.07"/>
  <text x="590" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0">Plastic Hunter AI Architecture</text>
  <text x="590" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#94a3b8">FastAPI deployment with research-backed CV validation and eco-adaptive sonar simulation</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(340 136)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">User</text>
    </g>
    <g transform="translate(340 226)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">FastAPI API</text>
    </g>
    <g transform="translate(340 316)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Computer Vision</text>
    </g>
    <g transform="translate(340 406)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Sonar Engine</text>
    </g>
    <g transform="translate(340 496)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">SQLite</text>
    </g>
    <g transform="translate(340 586)">
      <rect width="500" height="60" rx="10" fill="url(#node)" stroke="#24405c"/>
      <rect width="6" height="60" rx="3" fill="url(#accent)"/>
      <text x="250" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">Analytics</text>
    </g>
    <g transform="translate(340 676)">
      <rect width="500" height="44" rx="10" fill="url(#accent)" opacity="0.95"/>
      <text x="250" y="29" text-anchor="middle" font-size="20" font-weight="800" fill="#04111d">Dashboard</text>
    </g>
  </g>

  <g stroke="#22c5d8" stroke-width="3" marker-end="url(#arrow)" opacity="0.9">
    <line x1="590" y1="198" x2="590" y2="220"/>
    <line x1="590" y1="288" x2="590" y2="310"/>
    <line x1="590" y1="378" x2="590" y2="400"/>
    <line x1="590" y1="468" x2="590" y2="490"/>
    <line x1="590" y1="558" x2="590" y2="580"/>
    <line x1="590" y1="648" x2="590" y2="670"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">
    <text x="862" y="259">REST endpoints</text>
    <text x="862" y="349">Image upload and validation</text>
    <text x="862" y="439">Physics-based acoustic scenario</text>
    <text x="862" y="529">Mission records</text>
    <text x="862" y="619">KPIs and evidence sheet</text>
  </g>
</svg>
