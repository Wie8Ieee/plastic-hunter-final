<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="title desc">
  <title id="title">Plastic Hunter AI Architecture</title>
  <desc id="desc">A clean system architecture flow from mission user to FastAPI, computer vision, sonar simulation, SQLite, analytics, dashboard, evidence, and disclosure outputs.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#177e89"/>
      <stop offset="100%" stop-color="#2f7d57"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faf7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#41515c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#177e89"/>
    </marker>
  </defs>

  <rect width="1180" height="740" rx="28" fill="#f4f1ea"/>
  <rect x="34" y="34" width="1112" height="672" rx="18" fill="#ffffff" stroke="#d6dee3"/>
  <rect x="62" y="62" width="5" height="72" rx="2.5" fill="#177e89"/>

  <text x="88" y="88" font-family="Aptos Display, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#102033">Plastic Hunter AI Architecture</text>
  <text x="88" y="120" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="16" fill="#586878">FastAPI deployment with research-backed CV validation and eco-adaptive sonar simulation</text>
  <line x1="88" y1="150" x2="1092" y2="150" stroke="#d6dee3" stroke-width="1"/>

  <g font-family="Aptos, Segoe UI, Arial, sans-serif" filter="url(#softShadow)">
    <g transform="translate(96 190)">
      <rect width="280" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#177e89"/>
      <text x="30" y="38" font-size="16" font-weight="800" fill="#102033">Mission User</text>
      <text x="30" y="64" font-size="12" fill="#586878">Uploads, simulates, and reviews evidence.</text>
    </g>

    <g transform="translate(450 190)">
      <rect width="280" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#177e89"/>
      <text x="30" y="38" font-size="16" font-weight="800" fill="#102033">FastAPI Backend</text>
      <text x="30" y="64" font-size="12" fill="#586878">Routes, validation, evidence, and APIs.</text>
    </g>

    <g transform="translate(804 190)">
      <rect width="280" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#177e89"/>
      <text x="30" y="38" font-size="16" font-weight="800" fill="#102033">Browser Dashboard</text>
      <text x="30" y="64" font-size="12" fill="#586878">Mission overview, map, history, sonar, evidence views.</text>
    </g>

    <g transform="translate(168 356)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#2f7d57"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">Computer Vision</text>
      <text x="30" y="62" font-size="12" fill="#586878">Portable demo plus CV validation track.</text>
    </g>

    <g transform="translate(466 356)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#2f7d57"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">Eco-Sonar Engine</text>
      <text x="30" y="62" font-size="12" fill="#586878">Propagation, SNR, duty cycle, SEL.</text>
    </g>

    <g transform="translate(764 356)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#2f7d57"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">SQLite Mission Log</text>
      <text x="30" y="62" font-size="12" fill="#586878">Seeded and uploaded inspection records.</text>
    </g>

    <g transform="translate(168 532)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#b7791f"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">Analytics</text>
      <text x="30" y="62" font-size="12" fill="#586878">KPIs, severity, sites, and estimates.</text>
    </g>

    <g transform="translate(466 532)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#b7791f"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">Evidence Sheet</text>
      <text x="30" y="62" font-size="12" fill="#586878">Baseline, test conditions, KPIs.</text>
    </g>

    <g transform="translate(764 532)">
      <rect width="250" height="92" rx="8" fill="url(#nodeFill)" stroke="#d6dee3"/>
      <rect x="0" y="0" width="5" height="92" rx="2.5" fill="#b7791f"/>
      <text x="30" y="36" font-size="16" font-weight="800" fill="#102033">Disclosure</text>
      <text x="30" y="62" font-size="12" fill="#586878">AI methods, libraries, datasets, sources, and assumptions.</text>
    </g>
  </g>

  <g stroke="#177e89" stroke-width="2.2" fill="none" marker-end="url(#arrow)" opacity="0.88">
    <path d="M376 236 H444"/>
    <path d="M730 236 H798"/>
    <path d="M590 282 V342"/>
    <path d="M590 448 V518"/>
    <path d="M293 448 V518"/>
    <path d="M889 448 V518"/>
    <path d="M450 236 C390 285 350 315 293 348"/>
    <path d="M730 236 C780 285 830 315 889 348"/>
    <path d="M418 402 H460"/>
    <path d="M716 402 H758"/>
    <path d="M418 578 H460"/>
    <path d="M716 578 H758"/>
  </g>

  <g font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="12" fill="#586878">
    <text x="106" y="668">Runtime outputs such as detections.db and generated result images are recreated automatically.</text>
    <text x="106" y="692">Datasets and training artifacts stay outside the final repository; judges receive code, assumptions, screenshots, and demo steps.</text>
  </g>
</svg>
